services:
  - type: web
    name: cyclo-sense-fastapi
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
  - type: web
    name: cyclo-sense-flask-api
    runtime: python
    plan: free
    buildCommand: pip install -r deployment/flask-api-requirements.txt
    startCommand: gunicorn backend.api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
